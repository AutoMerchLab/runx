name: Setup Linux sandbox
description: Install and enable the deny-by-default Bubblewrap sandbox on Ubuntu runners.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
