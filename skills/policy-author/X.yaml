skill: policy-author
version: "0.2.0"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none
runners:
  author:
    default: true
    type: graph
    inputs:
      governance_brief:
        type: string
        required: true
        description: The governance intent in prose.
      existing_policy:
        type: json
        required: false
        description: A current runx.operational_policy.v1 to tighten without widening authority.
      target_repos:
        type: json
        required: false
        description: Explicit repository list when not stated in the brief.
      objective:
        type: string
        required: false
        description: Operator intent that focuses the pass.
    graph:
      name: policy-author
      steps:
        - id: draft
          label: draft the narrowest operational policy
          run:
            type: agent-task
            agent: builder
            task: policy-author-draft
            outputs:
              policy_proposal: object
          inputs:
            governance_brief: $input.governance_brief
            existing_policy: $input.existing_policy
            target_repos: $input.target_repos
            objective: $input.objective
          instructions: >
            Draft one policy proposal using the exact runx.operational_policy.v1
            contract described by the skill. Return decision, policy, rationale,
            blockers, needs_input, and success_checkpoint. Do not author a lint
            verdict: the next deterministic step invokes native runx policy lint.
            If required repos, source locators, owners, or runner bindings are
            missing, return needs_input with policy null. When existing_policy is
            supplied, never add authority, targets, sources, runners, locators, or
            actions; only tighten permissions, confidence, routing, and outcomes.
          artifacts:
            named_emits:
              policy_proposal: policy_proposal
        - id: validate
          label: validate with the native policy engine
          context:
            policy_proposal: draft.policy_proposal.data
          inputs:
            existing_policy: $input.existing_policy
          run:
            type: cli-tool
            command: node
            args:
              - ./validate_policy.mjs
            outputs:
              policy_proposal: object
          artifacts:
            wrap_as: policy_proposal_packet
            packet: runx.policy_proposal.v1
