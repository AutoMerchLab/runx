skill: mock-refund
version: "0.3.0"
catalog:
  kind: graph
  audience: operator
  visibility: internal
  role: harness-fixture
  part_of:
    - runx/refund
runners:
  mock:
    default: true
    type: graph
    inputs:
      original_receipt_ref:
        type: string
        required: true
        description: Opaque sealed charge receipt reference.
      refund_request:
        type: object
        required: true
        description: Positive minor-unit amount, reason, and optional payer check.
      parent_payment_authority:
        type: object
        required: true
        description: Full typed parent refund AuthorityTerm.
    graph:
      name: mock-refund
      result_from: [refund]
      steps:
        - id: refund
          skill: ../refund
          runner: mock
          inputs:
            original_receipt_ref: $input.original_receipt_ref
            refund_request: $input.refund_request
            parent_payment_authority: $input.parent_payment_authority
    runx:
      payment_authority:
        direction: provider_refund
        phase: plan
        resource_family: effect
        settlement_family: mock
        receipt_before_success_required: true
        runtime_refund_enabled: false
