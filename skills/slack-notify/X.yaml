skill: slack-notify
version: "0.3.0"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/send-as
  provider: slack
  runtime_path: slack
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
runners:
  plan:
    default: true
    type: graph
    inputs:
      channel:
        type: string
        required: true
        description: "Slack #name, channel id, or exact slack://workspace/channel locator."
      content:
        type: json
        required: true
        description: Inline message or digest-bound content reference.
      principal:
        type: string
        required: true
        description: Principal the notification would be posted as.
      provider_context:
        type: json
        required: false
        description: Connector and workspace readiness supplied to send-as.
    graph:
      name: slack-notify-plan
      result_from: [finalize, reject]
      steps:
        - id: prepare
          inputs:
            channel: $input.channel
            content: $input.content
            principal: $input.principal
          run:
            type: javascript
            module: slack-notify.mjs
            export: prepareNotification
            outputs:
              notification_admission: object
              digest_input: string
        - id: digest-content
          tool: data.digest
          inputs:
            encoding: utf8_text
          context:
            value: prepare.digest_input
        - id: bind-content
          context:
            notification_admission: prepare.notification_admission
            digest_result: digest-content.digest_result.data
          run:
            type: javascript
            module: slack-notify.mjs
            export: bindNotification
            outputs:
              slack_context: object
          artifacts:
            named_emits:
              slack_context: slack_context
            packets:
              slack_context: runx.slack.notification_context.v1
        - id: authorize
          when:
            field: bind-content.slack_context.data.decision
            equals: ready
          skill: ../send-as
          runner: plan
          inputs:
            objective: Authorize one digest-bound Slack notification for later provider delivery.
            principal: $input.principal
            audience: $input.channel
            provider_context: $input.provider_context
          context:
            slack_context: bind-content.slack_context.data
        - id: finalize
          when:
            field: bind-content.slack_context.data.decision
            equals: ready
          context:
            slack_context: bind-content.slack_context.data
            send_plan: authorize.send_plan.data
          run:
            type: javascript
            module: slack-notify.mjs
            export: finalizeNotification
            outputs:
              notify_plan: object
          artifacts:
            named_emits:
              notify_plan: notify_plan
            packets:
              notify_plan: runx.notify.v1
        - id: reject
          when:
            field: bind-content.slack_context.data.decision
            equals: blocked
          context:
            slack_context: bind-content.slack_context.data
          run:
            type: javascript
            module: slack-notify.mjs
            export: finalizeNotification
            outputs:
              notify_plan: object
          artifacts:
            named_emits:
              notify_plan: notify_plan
            packets:
              notify_plan: runx.notify.v1
  deliver:
    type: graph
    inputs:
      notification_plan:
        type: object
        required: true
        description: Exact notify_plan emitted by the plan runner.
      channel_locator:
        type: string
        required: true
        description: Exact slack://workspace/channel locator bound by the plan and connector grant.
      text:
        type: string
        required: true
        description: Exact message text whose digest must match notification_plan.
      idempotency_key:
        type: string
        required: true
        description: Stable UUID for this exact Slack delivery.
    graph:
      name: slack-notify-deliver
      result_from: [readback]
      steps:
        - id: digest
          tool: data.digest
          inputs:
            value: $input.text
            encoding: utf8_text
        - id: bind-plan
          tool: data.compare
          inputs:
            actual:
              decision: $input.notification_plan.decision
              provider: $input.notification_plan.provider
              channel: $input.notification_plan.channel
              provider_status: $input.notification_plan.provider_status
              delivery_status: $input.notification_plan.delivery_status
            expected:
              decision: ready_for_provider
              provider: slack
              channel: $input.channel_locator
              provider_status: not_called
              delivery_status: not_sent
        - id: bind-content
          tool: data.compare
          when:
            field: bind-plan.comparison.data.equal
            equals: true
          inputs:
            expected: $input.notification_plan.content_digest
          context:
            actual: digest.digest_result.data.digest
        - id: deliver
          tool: provider.mutate
          scopes:
            - channel.post
          mutation: true
          idempotency_key: $input.idempotency_key
          when:
            field: bind-content.comparison.data.equal
            equals: true
          policy:
            provider_permission:
              verb: write
          inputs:
            operation: channel.post
            target: $input.channel_locator
            expected_provider: slack
            idempotency_key: $input.idempotency_key
            expected_result:
              conversation_locator: $input.channel_locator
              content_digest: $input.notification_plan.content_digest
            result_fields: [message_locator, conversation_locator, content_digest, occurred_at]
            input:
              channel_locator: $input.channel_locator
              text: $input.text

        - id: readback
          when:
            field: bind-content.comparison.data.equal
            equals: true
          tool: provider.read
          scopes:
            - channel.post.read
          policy:
            provider_permission:
              verb: read
          inputs:
            operation: channel.post.read
            target: $input.channel_locator
            expected_provider: slack
            result_fields: [message_locator, conversation_locator, content_digest, occurred_at]
          context:
            expected_result: deliver.provider_operation.data.result
            input: deliver.provider_operation.data.result
