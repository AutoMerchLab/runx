name: slack-notify-default-requires-live-delivery-binding
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    request: Notify this Slack channel that release 0.8.2 is live.
    expected_outcome: Preflight the exact notification once and return one actionable connector blocker when delivery is unavailable.
  - mode: composed
    request: Deliver this already prepared release notification to the selected Slack channel.
    expected_outcome: Reuse the exact body, channel, and principal without redrafting or claiming delivery.
    prior_evidence:
      - The prepared notification text, channel locator, and principal supplied in the fixture.
    must_not_repeat:
      - Do not redraft or reapprove the notification.
      - Do not claim delivery without a compatible connector.
inputs:
  channel_locator: slack://T123/C456
  text: Release 0.8.2 is live.
  principal: runx:principal:release-bot
expect:
  status: failure
metadata:
  public_skill: slack-notify
  source_case: direct-default-preflight
  source: skills-fixture
