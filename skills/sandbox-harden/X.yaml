skill: sandbox-harden
version: "0.3.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none

runners:
  sandbox-harden:
    default: true
    type: graph
    inputs:
      workload:
        type: json
        required: true
        description: Immutable workload identity plus source-bound Runx runtime requirements.
      as_of:
        type: string
        required: true
        description: Explicit RFC3339 evaluation time for requirements freshness.
      max_age_days:
        type: number
        required: false
        default: 30
        description: Maximum accepted requirements age in days.
      baseline:
        type: json
        required: false
        description: Optional network, writable-path, environment, and enforcement ceilings.
    graph:
      name: sandbox-harden
      steps:
        - id: plan
          tool: sandbox.plan
          inputs:
            workload: $input.workload
            as_of: $input.as_of
            max_age_days: $input.max_age_days
            baseline: $input.baseline
