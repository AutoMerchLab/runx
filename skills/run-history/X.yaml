skill: run-history
version: "0.2.3"

catalog:
  kind: skill
  audience: operator
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: reports-native-history-and-catalog-coverage
      inputs:
        objective: Show how Runx behaved over the supplied window.
        scope: workspace
        period: 30d
        history_receipts:
          - id: rcpt_1
            name: release
            status: closed
            created_at: "2026-07-01T00:00:00Z"
          - id: rcpt_2
            name: release
            status: blocked
            created_at: "2026-07-02T00:00:00Z"
        catalog_items:
          - name: release
            status: ok
            fixtures: 2
            harness_cases: 1
          - name: untested
            status: ok
            fixtures: 0
            harness_cases: 0
      expect:
        status: sealed
        step_outputs:
          finalize-replay:
            subset:
              history_report:
                schema: runx.history_report.v1
                decision: ready
                catalog:
                  entry_count: 2
                  tested_entry_count: 1
                  untested_entry_count: 1
                  coverage_rate: 0.5
                runs:
                  terminal_count: 2
                  pending_count: 0
                  closed_rate: 0.5
                  refusal_rate: 0.5
                sources:
                  history: supplied_replay
                  catalog: supplied_replay
        receipt:
          schema: runx.receipt.v1

    - name: filters-one-skill
      inputs:
        objective: Review release runs only.
        scope: release
        history_receipts:
          - id: rcpt_release
            name: release
            status: closed
            created_at: "2026-07-01T00:00:00Z"
          - id: rcpt_other
            name: research
            status: failed
            created_at: "2026-07-01T00:00:00Z"
        catalog_items: []
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

    - name: empty-history-stops-for-evidence
      inputs:
        objective: Show how our skills are doing.
        history_receipts: []
        pending_runs: []
        catalog_items: []
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1

runners:
  report:
    default: true
    type: graph
    inputs:
      objective:
        type: string
        required: true
        description: The bounded history question.
      scope:
        type: string
        required: false
        default: workspace
        description: workspace, all, or one skill/subject name.
      period:
        type: string
        required: false
        description: Relative lookback such as 7d or 30d, or an RFC 3339 lower bound.
      as_of:
        type: string
        required: false
        description: Optional RFC3339 anchor for a reproducible relative lookback.
      limit:
        type: number
        required: false
        default: 1000
        description: Maximum receipt and pending-run rows to inspect; must be from 1 to 10000.
      history_receipts:
        type: json
        required: false
        description: Explicit receipt rows for deterministic replay; live runs use native runx history.
      pending_runs:
        type: json
        required: false
        description: Explicit pending-run rows paired with history_receipts during replay.
      catalog_items:
        type: json
        required: false
        description: Explicit catalog rows paired with history_receipts for deterministic replay.
    graph:
      name: run-history
      result_from: [finalize-live, finalize-replay]
      steps:
        - id: prepare
          label: normalize the bounded report request
          inputs:
            objective: $input.objective
            scope: $input.scope
            period: $input.period
            as_of: $input.as_of
            limit: $input.limit
            history_receipts: $input.history_receipts
            catalog_items: $input.catalog_items
          run:
            type: javascript
            module: run-history.mjs
            export: prepareHistory
            outputs:
              history_context: object
          artifacts:
            named_emits:
              history_context: history_context
        - id: history
          label: query native receipt history
          when:
            field: prepare.history_context.data.path
            equals: live
          tool: receipt.query
          scopes:
            - receipt.read
          context:
            skill: prepare.history_context.data.skill_filter
            period: prepare.history_context.data.period
            as_of: prepare.history_context.data.as_of
            limit: prepare.history_context.data.limit
        - id: catalog
          label: inspect native skill coverage
          when:
            field: prepare.history_context.data.path
            equals: live
          tool: runx.skill.inspect
          scopes:
            - fs.read
          inputs:
            repo_root: .
        - id: finalize-live
          label: calculate the live history report
          when:
            field: prepare.history_context.data.path
            equals: live
          run:
            type: javascript
            module: run-history.mjs
            export: finalizeHistory
            outputs:
              history_report: object
          context:
            history_context: prepare.history_context.data
            receipt_query: history.receipt_query.data
            authoring_context: catalog.authoring_context.data
          artifacts:
            wrap_as: history_report_packet
            packet: runx.history_report.v1
        - id: finalize-replay
          label: calculate the supplied replay report
          when:
            field: prepare.history_context.data.path
            equals: replay
          inputs:
            history_receipts: $input.history_receipts
            pending_runs: $input.pending_runs
            catalog_items: $input.catalog_items
          run:
            type: javascript
            module: run-history.mjs
            export: finalizeHistory
            outputs:
              history_report: object
          context:
            history_context: prepare.history_context.data
          artifacts:
            wrap_as: history_report_packet
            packet: runx.history_report.v1
