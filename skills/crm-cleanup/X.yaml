skill: crm-cleanup
version: "1.0.2"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: templated
      runner: default
      inputs:
        transcript: "The client said the budget is $50k. The status is qualified. The next step is follow up call."
        crm_schema: "{\"fields\": [\"budget\", \"status\", \"next_step\"]}"
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
    - name: natural
      runner: default
      inputs:
        transcript: "Great call. They have got around $75k to spend this quarter, so I am moving them to qualified. I will send over a proposal by Friday."
        crm_schema: "{\"fields\": [\"budget\", \"status\", \"next_step\"]}"
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
    - name: needs_review
      runner: default
      inputs:
        transcript: "We talked budget but they were cagey about the exact number. We should update their status after legal reviews the contract."
        crm_schema: "{\"fields\": [\"budget\", \"status\", \"next_step\"]}"
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
    - name: noop
      runner: default
      inputs:
        transcript: "Quick sync, everything is on track, nothing to update right now."
        crm_schema: "{\"fields\": [\"budget\", \"status\", \"next_step\"]}"
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
    - name: invalid_schema
      runner: default
      inputs:
        transcript: "Client wants to move forward."
        crm_schema: "{}"
      expect:
        status: failure
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: failed

runners:
  default:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    inputs:
      transcript:
        type: string
        required: true
      crm_schema:
        type: string
        required: true
    outputs:
      takeaways: array
      field_updates: object
      needs_review: array
      write_proposal: boolean
