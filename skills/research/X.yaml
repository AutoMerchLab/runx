skill: research
version: "0.3.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none

runners:
  research:
    default: true
    type: graph
    inputs:
      objective:
        type: string
        required: true
        description: Bounded question the research pass must answer.
      source_packets:
        type: json
        required: true
        description: Bounded governed provider evidence, normally runx.fetch.v1 packets from web-fetch.
      domain:
        type: string
        required: false
        description: Domain or market context for the question.
      deliverable:
        type: string
        required: false
        description: Target artifact or decision the research must support.
      operator_context:
        type: string
        required: false
        description: Local constraints that shape interpretation but do not count as evidence.
      target_entities:
        type: json
        required: false
        description: Entities to include or compare.
    graph:
      name: research
      steps:
        - id: index
          label: index bounded source evidence
          tool: evidence.index_fetch_sources
          inputs:
            objective: $input.objective
            source_packets: $input.source_packets
          artifacts:
            named_emits:
              source_index: source_index

        - id: reject
          label: seal a sanitized evidence stop
          when:
            field: index.source_index.data.decision
            equals: needs_more_evidence
          tool: evidence.verify_artifact
          inputs:
            artifact_name: research_packet
            candidate:
              decision: ready
            require_claim_bindings: true
            fallback_artifact:
              decision: needs_more_evidence
              research_brief:
                objective: ""
                scope: ""
                summary: ""
                open_questions: []
              evidence_log: []
              decision_support: []
              risks: []
              source_evidence: []
              index_digest: ""
            fallback_bindings:
              - target_path: research_brief.objective
                source_path: objective
              - target_path: research_brief.open_questions
                source_path: blockers
              - target_path: source_evidence
                source_path: source_evidence
              - target_path: index_digest
                source_path: index_digest
          context:
            fallback_source: index.source_index.data
            source_records: index.source_index.data.sources
          artifacts:
            named_emits:
              research_packet: verified_artifact
            packets:
              research_packet: runx.research.packet.v1

        - id: synthesize
          label: synthesize indexed evidence
          when:
            field: index.source_index.data.decision
            equals: ready
          run:
            type: agent-task
            agent: researcher
            task: research-synthesize
            outputs:
              research_candidate: object
          inputs:
            objective: $input.objective
            domain: $input.domain
            deliverable: $input.deliverable
            operator_context: $input.operator_context
            target_entities: $input.target_entities
          context:
            source_index: index.source_index.data
          artifacts:
            named_emits:
              research_candidate: research_candidate

        - id: finalize
          label: verify evidence bindings and finalize the artifact
          when:
            field: index.source_index.data.decision
            equals: ready
          tool: evidence.verify_artifact
          inputs:
            artifact_name: research_packet
            required_paths:
              - research_brief.summary
              - decision_support
            required_value_bindings:
              - candidate_path: research_brief.objective
                source_path: objective
            authoritative_bindings:
              - target_path: source_evidence
                source_path: source_evidence
              - target_path: index_digest
                source_path: index_digest
            fallback_artifact:
              decision: needs_more_evidence
              research_brief:
                objective: ""
                scope: ""
                summary: ""
                open_questions:
                  - Evidence bindings did not validate.
              evidence_log: []
              decision_support: []
              risks: []
              source_evidence: []
              index_digest: ""
            fallback_bindings:
              - target_path: research_brief.objective
                source_path: objective
              - target_path: source_evidence
                source_path: source_evidence
              - target_path: index_digest
                source_path: index_digest
          context:
            candidate: synthesize.research_candidate.data
            claim_bindings: synthesize.research_candidate.data.evidence_log
            reference_bindings: synthesize.research_candidate.data.decision_support
            source_digests: index.source_index.data.source_digests
            source_records: index.source_index.data.sources
            identity_source: index.source_index.data
            authoritative_source: index.source_index.data
            fallback_source: index.source_index.data
          artifacts:
            named_emits:
              research_packet: verified_artifact
            packets:
              research_packet: runx.research.packet.v1
