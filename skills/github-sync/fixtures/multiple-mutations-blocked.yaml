name: github-sync-blocks-non-atomic-mutation-batches
kind: skill
target: ..
runner: github-sync
inputs:
  repo: runxhq/runx
  direction: push
  resources:
    kind: issues
    filters: { limit: 2 }
    mutations:
      - { ref: issues/241, op: update, payload: { labels: [triage] } }
      - { ref: issues/242, op: update, payload: { labels: [triage] } }
  scope: write
expect:
  status: sealed
  output:
    subset:
      sync_plan:
        decision: blocked
        provider_status: not_called
  receipt: { schema: runx.receipt.v1 }
metadata: { public_skill: github-sync, source_case: non-atomic-batch, source: skills-fixture }
