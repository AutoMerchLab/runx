skill: vault-unseal
version: "0.3.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical
  runtime_path: vault
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required

runners:
  vault-unseal:
    default: true
    type: javascript
    module: vault-unseal.mjs
    outputs:
      unseal_plan: object
    artifacts:
      named_emits:
        unseal_plan: unseal_plan
      packets:
        unseal_plan: runx.unseal.v1
    inputs:
      secret_ref:
        type: string
        required: true
        description: Opaque vault, secret, or handle reference; never a secret value.
      purpose:
        type: string
        required: true
        description: Bounded reason access is needed.
      ttl:
        type: string
        required: true
        description: Duration from 1m through 60m.
      scope:
        type: json
        required: true
        description: Resource, action, and optional path the handle may unlock.
      principal:
        type: string
        required: true
        description: Principal attributed to the future access.
      policy_notes:
        type: string
        required: false
        description: Policy context preserved for the downstream approver.

  execute:
    type: graph
    inputs:
      provider:
        type: string
        required: true
        description: Expected configured vault provider name.
      secret_ref:
        type: string
        required: true
        description: Opaque vault, secret, or handle reference; never a secret value.
      purpose:
        type: string
        required: true
        description: Bounded reason access is needed.
      ttl:
        type: string
        required: true
        description: Duration from 1m through 60m.
      scope:
        type: json
        required: true
        description: Resource, action, and optional path the handle may unlock.
      principal:
        type: string
        required: true
        description: Principal receiving the future opaque handle.
      policy_notes:
        type: string
        required: false
        description: Policy context preserved for the approver and provider.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact unseal request.
    graph:
      name: vault-unseal-execute
      steps:
        - id: plan
          inputs:
            secret_ref: $input.secret_ref
            purpose: $input.purpose
            ttl: $input.ttl
            scope: $input.scope
            principal: $input.principal
            policy_notes: $input.policy_notes
          run:
            type: javascript
            module: vault-unseal.mjs
            outputs:
              unseal_plan: object
          artifacts:
            named_emits:
              unseal_plan: unseal_plan
            packets:
              unseal_plan: runx.unseal.v1

        - id: issue-handle
          when:
            field: plan.unseal_plan.data.decision
            equals: ready_for_approval
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_key
          scopes:
            - secret.unseal
          policy:
            provider_permission:
              verb: write
          inputs:
            operation: secret.unseal
            target: $input.secret_ref
            expected_provider: $input.provider
            idempotency_key: $input.idempotency_key
            result_fields: [handle_ref, expires_at, status]
            input:
              secret_ref: $input.secret_ref
              purpose: $input.purpose
              ttl: $input.ttl
              scope: $input.scope
              principal: $input.principal

        - id: readback
          when:
            field: plan.unseal_plan.data.decision
            equals: ready_for_approval
          tool: provider.read
          scopes:
            - handle.read
          policy:
            provider_permission:
              verb: read
          inputs:
            operation: handle.read
            target: $input.secret_ref
            expected_provider: $input.provider
            result_fields: [handle_ref, expires_at, status]
          context:
            expected_result: issue-handle.provider_operation.data.result
            input: issue-handle.provider_operation.data.result
