skill: postmortem-maker
version: "2.0.1"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    # A thread that settles its own cause: one change is named in an unhedged
    # causal statement and the rollback corroborates it. The postmortem is
    # authorized, the provider adapter executes the send, and step 5 reads the
    # message back out of the outbox and re-digests it.
    - name: consistent-incident-published
      runner: default
      inputs:
        incident_source:
          kind: inline
          ref: "inline://harness/checkout-incident"
          thread:
            title: "Checkout error rate spike"
            url: "inline://harness/checkout-incident"
            events:
              - id: "evt-1"
                at: "2026-08-01T10:02:00Z"
                author: "monitoring"
                text: "At 10:02 the checkout error rate spiked to 40 percent and roughly 1200 users saw failed checkouts over 18 minutes."
              - id: "evt-2"
                at: "2026-08-01T10:10:00Z"
                author: "oncall"
                text: "The 09:58 checkout-api v2.4.1 deploy introduced a null pointer in the payment path, so the failures are caused by that release."
              - id: "evt-3"
                at: "2026-08-01T10:21:00Z"
                author: "oncall"
                text: "Rolled back checkout-api and at 10:20 the error rate returned to baseline."
              - id: "evt-4"
                at: "2026-08-01T10:40:00Z"
                author: "eng-lead"
                text: "Action item: add a payment path contract test before the next release."
        publish_target:
          data_source_ref: "local://runx-postmortems/harness"
          channel: "incident-review"
          aggregate_id: "harness-checkout-incident"
          principal: "incident-review-bot"
          audience: "incident-review"
        postmortem_policy:
          require_confirmed_root_cause: true
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
        step_outputs:
          compose:
            subset:
              publishable: true
              root_cause_status: confirmed
          deliver:
            subset:
              delivery_result:
                status: delivered
                operation: send
                replayed: false
                before_version: 0
                after_version: 1
          verify:
            subset:
              readback:
                delivered: true
                digest_match: true
                outbox_version_after: 1

    # Two changes compete for the cause and every statement is hedged. The
    # postmortem records the unknowns and publishes nothing; step 5 asserts the
    # absence of a send plan, a provider act, and a delivery.
    - name: conflicting-evidence-withheld
      runner: default
      inputs:
        incident_source:
          kind: inline
          ref: "inline://harness/latency-incident"
          thread:
            title: "API latency above SLO"
            url: "inline://harness/latency-incident"
            events:
              - id: "evt-1"
                at: "2026-08-02T14:05:00Z"
                author: "monitoring"
                text: "At 14:05 API latency degraded above the SLO and the error rate rose."
              - id: "evt-2"
                at: "2026-08-02T14:15:00Z"
                author: "dev1"
                text: "Might be the api-gateway v1.2.0 deploy that caused it?"
              - id: "evt-3"
                at: "2026-08-02T14:17:00Z"
                author: "dev2"
                text: "I suspect the search v3.1.0 change instead, not sure."
        publish_target:
          data_source_ref: "local://runx-postmortems/harness"
          channel: "incident-review"
          aggregate_id: "harness-latency-incident"
          principal: "incident-review-bot"
          audience: "incident-review"
        postmortem_policy:
          require_confirmed_root_cause: true
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
        step_outputs:
          compose:
            subset:
              publishable: false
              root_cause_status: unconfirmed
          verify:
            subset:
              readback:
                delivered: false
                delivery_exists: false
                provider_act_performed: false
                outbox_unchanged: true

    # Nothing readable to reconstruct a postmortem from: the run refuses.
    - name: empty-thread-refused
      runner: default
      inputs:
        incident_source:
          kind: inline
          ref: "inline://harness/empty-incident"
          thread:
            title: "Empty incident"
            url: "inline://harness/empty-incident"
            events: []
        publish_target:
          data_source_ref: "local://runx-postmortems/harness"
          channel: "incident-review"
          aggregate_id: "harness-empty-incident"
        postmortem_policy:
          require_confirmed_root_cause: true
      expect:
        status: failure

runners:
  default:
    default: true
    type: graph
    inputs:
      incident_source:
        type: json
        required: true
        description: >-
          Where the incident record is read from at run time. {kind: "github_issue",
          ref: "<issue api url>"} fetches the real thread and its comments over HTTPS;
          {kind: "inline", thread: {...}} replays a bundled thread for deterministic,
          egress-free harness cases.
      publish_target:
        type: json
        required: true
        description: >-
          Outbox the postmortem is delivered to when publication is authorized:
          {data_source_ref, channel, aggregate_id} plus optional principal, audience,
          classification, and visibility for the send plan.
      postmortem_policy:
        type: json
        required: false
        description: >-
          Publication gate. require_confirmed_root_cause (default true) withholds
          publication unless exactly one change is named as the cause in an unhedged
          statement in the thread.
    graph:
      name: postmortem-maker
      result_from:
        - compose
        - deliver
        - verify
      steps:
        - id: read_incident
          label: read the incident thread from a real source at run time
          inputs:
            incident_source: "$input.incident_source"
          run:
            type: cli-tool
            command: node
            args:
              - steps/read_incident.mjs
            outputs:
              incident: object

        - id: read_outbox
          label: read the publication outbox stream and its version
          inputs:
            publish_target: "$input.publish_target"
          run:
            type: cli-tool
            command: node
            args:
              - steps/read_outbox.mjs
            outputs:
              outbox: object

        - id: compose
          label: reconstruct the postmortem and decide whether it may be published
          inputs:
            postmortem_policy: "$input.postmortem_policy"
            publish_target: "$input.publish_target"
          context:
            incident: read_incident.incident
            outbox: read_outbox.outbox
          run:
            type: cli-tool
            command: node
            args:
              - steps/compose.mjs
            outputs:
              postmortem: object
              fetched_at: string
              unknowns: array
              action_items: array
              root_cause_status: string
              timeline_count: number
              publishable: boolean
              send_plan: object
              content_digest: string
              idempotency_key: string
              expected_version: number
              message: object

        - id: deliver
          label: execute the authorized send into the outbox under compare-and-set
          when:
            field: compose.publishable
            equals: true
          inputs:
            publish_target: "$input.publish_target"
          context:
            send_plan: compose.send_plan
            message: compose.message
            idempotency_key: compose.idempotency_key
            expected_version: compose.expected_version
          run:
            type: cli-tool
            command: node
            args:
              - steps/deliver.mjs
            outputs:
              delivery_result: object

        - id: verify
          label: read the outbox back and assert the delivery (or its absence)
          inputs:
            publish_target: "$input.publish_target"
          context:
            send_plan: compose.send_plan
            publishable: compose.publishable
            idempotency_key: compose.idempotency_key
            content_digest: compose.content_digest
            expected_version: compose.expected_version
          run:
            type: cli-tool
            command: node
            args:
              - steps/verify.mjs
            outputs:
              readback: object
