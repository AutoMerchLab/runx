name: twitter-default-requires-account-binding
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    confusors: [moltbook, ecosystem-brief]
    request: Read the bounded current snapshot for this X account.
    expected_outcome: Use the live account read runner by default and return bounded provider evidence through an explicitly supplied tenant credential binding.
env:
  TWITTER_USER_AUTH: '{"consumer_key":"harness-consumer","consumer_secret":"harness-secret","access_token":"harness-access","access_secret":"harness-access-secret"}'
inputs:
  query: snapshot
  auth: user
  max_items: 200
caller:
