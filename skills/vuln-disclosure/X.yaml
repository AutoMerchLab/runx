skill: vuln-disclosure
version: "0.3.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  runtime_path: advisory-publication
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required

runners:
  vuln-disclosure:
    default: true
    type: graph
    inputs:
      advisory_packet:
        type: json
        required: true
        description: Validated runx.security.vulnerability_advisory.v1 packet.
      channel:
        type: string
        required: true
        description: Intended publication channel.
      target:
        type: json
        required: true
        description: Exact downstream target with a locator.
      disclosure_context:
        type: json
        required: false
        description: Embargo, coordination, remediation, or timing constraints.
    graph:
      name: vuln-disclosure
      result_from: [finalize, stop]
      steps:
        - id: admit
          inputs:
            advisory_packet: $input.advisory_packet
            channel: $input.channel
            target: $input.target
            disclosure_context: $input.disclosure_context
          run:
            type: javascript
            module: vuln-disclosure.mjs
            export: admitDisclosure
            outputs:
              disclosure_context: object
          artifacts:
            named_emits:
              disclosure_context: disclosure_context

        - id: digest-payload
          tool: data.digest
          context:
            value: admit.disclosure_context.data.payload

        - id: review
          when:
            field: admit.disclosure_context.data.path
            equals: review
          run:
            type: agent-task
            agent: reviewer
            task: vuln-disclosure-review
            outputs:
              disclosure_review_draft: object
          context:
            disclosure_context: admit.disclosure_context.data
          artifacts:
            named_emits:
              disclosure_review_draft: disclosure_review_draft

        - id: finalize
          when:
            field: admit.disclosure_context.data.path
            equals: review
          context:
            disclosure_context: admit.disclosure_context.data
            payload_digest: digest-payload.digest_result.data.digest
            disclosure_review_draft: review.disclosure_review_draft.data
          run:
            type: javascript
            module: vuln-disclosure.mjs
            export: finalizeDisclosure
            outputs:
              disclosure_packet: object
          artifacts:
            named_emits:
              disclosure_packet: disclosure_packet
            packets:
              disclosure_packet: runx.security.vulnerability_disclosure.v1

        - id: stop
          when:
            field: admit.disclosure_context.data.path
            equals: stop
          context:
            disclosure_context: admit.disclosure_context.data
            payload_digest: digest-payload.digest_result.data.digest
          run:
            type: javascript
            module: vuln-disclosure.mjs
            export: finalizeDisclosure
            outputs:
              disclosure_packet: object
          artifacts:
            named_emits:
              disclosure_packet: disclosure_packet
            packets:
              disclosure_packet: runx.security.vulnerability_disclosure.v1

  publish:
    type: graph
    inputs:
      disclosure_packet:
        type: object
        required: true
        description: Exact validated runx.security.vulnerability_disclosure.v1 packet.
      provider:
        type: string
        required: true
        description: Expected configured publication provider name.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact advisory publication.
    graph:
      name: vuln-disclosure-publish
      result_from: [readback]
      steps:
        - id: validate
          tool: data.compare
          inputs:
            actual:
              decision: $input.disclosure_packet.decision
              validation_status: $input.disclosure_packet.validation.status
              approval_status: $input.disclosure_packet.approval_status
              publication_status: $input.disclosure_packet.publication_status
              provider_status: $input.disclosure_packet.provider_status
            expected:
              decision: ready_for_publication_approval
              validation_status: pass
              approval_status: not_requested
              publication_status: not_published
              provider_status: not_called

        - id: digest-payload
          when:
            field: validate.comparison.data.equal
            equals: true
          tool: data.digest
          inputs:
            value: $input.disclosure_packet.payload

        - id: bind-payload
          when:
            field: validate.comparison.data.equal
            equals: true
          tool: data.compare
          inputs:
            expected: $input.disclosure_packet.payload_digest
          context:
            actual: digest-payload.digest_result.data.digest

        - id: publish
          when:
            field: bind-payload.comparison.data.equal
            equals: true
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_key
          scopes:
            - advisory.publish
          policy:
            provider_permission:
              verb: write
          inputs:
            operation: advisory.publish
            target: $input.disclosure_packet.target
            expected_provider: $input.provider
            idempotency_key: $input.idempotency_key
            expected_result:
              payload_digest: $input.disclosure_packet.payload_digest
            result_fields: [advisory_ref, payload_digest]
            input:
              channel: $input.disclosure_packet.channel
              target: $input.disclosure_packet.target
              payload: $input.disclosure_packet.payload
              payload_digest: $input.disclosure_packet.payload_digest
              evidence_binding: $input.disclosure_packet.evidence_binding

        - id: readback
          when:
            field: bind-payload.comparison.data.equal
            equals: true
          tool: provider.read
          scopes:
            - advisory.read
          policy:
            provider_permission:
              verb: read
          inputs:
            operation: advisory.read
            target: $input.disclosure_packet.target
            expected_provider: $input.provider
            result_fields: [advisory_ref, payload_digest, status]
          context:
            expected_result: publish.provider_operation.data.result
            input: publish.provider_operation.data.result
