name: issue-to-pr-standalone-host-flow
kind: skill
target: ..
operator_journeys:
  - mode: standalone
    request: Fix issue 442 in this checkout, run the tests, finalize once, and stop before an unauthorized PR.
    expected_outcome: Resolve the repository, inspect the issue locally, preserve host edit and test results, finalize once, and return a compact blocked-before-publish result.
env:
  PATH: fixtures/bin:/usr/bin:/bin
  RUNX_CWD: ../..
  RUNX_ISSUE_TO_PR_GH_LOG: /tmp/runx-issue-to-pr-standalone-gh.log
  RUNX_PROVIDER_PERMISSION_GRANT_ID: ""
  RUNX_PROVIDER_PERMISSION_GRANTED_SCOPES: ""
  RUNX_PROVIDER_PERMISSION_PRINCIPAL_REF: ""
  RUNX_PROVIDER_PERMISSION_TRANSPORT: local:github
inputs:
  repository: .
  issue_number: "442"
  objective: Make the issue-to-PR lane operator-first.
caller:
  answers:
    agent_task.issue-to-pr-host-work.output:
      host_result:
        schema: runx.issue_to_pr.host_result.v1
        status: completed
        repository: runxhq/runx
        issue_number: "442"
        branch: fix/442-operator-first
        files: [oss/skills/issue-to-pr/X.yaml]
        tests:
          - command: cargo test -p runx-cli --test integration issue_to_pr_journey
            status: passed
            evidence: receipt:test:issue-to-pr-standalone
        finalization:
          status: passed
          receipt_ref: scafld:receipt:issue-to-pr-standalone
          contract_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          invocation_count: 1
        publication:
          decision: hold
          title: ""
          body: ""
          head: ""
          base: ""
          draft: false
          idempotency_key: ""
        errors: []
expect:
  status: sealed
  receipt: { schema: runx.receipt.v1 }
  output:
    subset:
      issue_to_pr_result:
        data:
          schema: runx.issue_to_pr.result.v1
          status: completed
          repository: runxhq/runx
          issue_number: "442"
          tested: true
          finalization_ref: scafld:receipt:issue-to-pr-standalone
          publication: { status: not_requested }
metadata:
  public_skill: issue-to-pr
  source_case: standalone-host-flow
  source: operator-journey
