skill: issue-to-pr
version: "0.3.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required

harness:
  files:
    - fixtures/bin/gh
  cases: []

input_definitions:
  repository:
    type: string
    required: true
    description: Explicit owner/name or '.' to resolve the current checkout remote before transport selection.
    schema:
      pattern: '^(?:\.|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$'
  issue_number:
    type: string
    required: true
    description: Positive GitHub issue number.
    schema: { pattern: '^[1-9][0-9]*$' }
  objective:
    type: string
    required: false
    description: Bounded desired outcome; the issue remains the source evidence.
  issue_evidence:
    type: json
    packet: runx.issue_to_pr.issue_evidence.v1
    required: true
    description: Prior typed issue evidence; supplying it skips provider discovery and read.
  host_result:
    type: json
    packet: runx.issue_to_pr.host_result.v1
    required: true
    description: Tested host change plus exactly one scafld finalize result.

runners:
  issue-to-pr:
    default: true
    type: graph
    inputs:
      repository: { definition: repository }
      issue_number: { definition: issue_number }
      objective: { definition: objective }
    graph:
      name: issue-to-pr
      result_from: [host]
      steps:
        - id: read-issue
          tool: provider.read
          scopes: [repo.read]
          policy:
            provider_permission:
              verb: read
          inputs:
            expected_provider: github
            operation: issue.read
            target: $input.repository
            result_fields: [repository, number, title, state, body, url, labels, assignees]
            input:
              issue_number: $input.issue_number

        - id: bind-issue-evidence
          inputs:
            requested_repository: $input.repository
            requested_issue_number: $input.issue_number
          context:
            provider_operation: read-issue.provider_operation.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: normalizeIssueEvidence
            outputs:
              issue_evidence: object
          artifacts:
            named_emits: { issue_evidence: issue_evidence }
            packets: { issue_evidence: runx.issue_to_pr.issue_evidence.v1 }

        - id: host
          skill: .
          runner: host
          inputs:
            objective: $input.objective
          context:
            issue_evidence: bind-issue-evidence.issue_evidence.data

  from-evidence:
    type: graph
    inputs:
      issue_evidence: { definition: issue_evidence }
      objective: { definition: objective }
    graph:
      name: issue-to-pr-from-evidence
      result_from: [host]
      steps:
        - id: host
          skill: .
          runner: host
          inputs:
            objective: $input.objective
            issue_evidence: $input.issue_evidence

  host:
    type: graph
    inputs:
      issue_evidence: { definition: issue_evidence }
      objective: { definition: objective }
    graph:
      name: issue-to-pr-host
      result_from: [publish, finalize-hold, finalize-blocked]
      steps:
        - id: host-work
          inputs:
            objective: $input.objective
            issue_evidence: $input.issue_evidence
          run:
            type: agent-task
            agent: builder
            task: issue-to-pr-host-work
            outputs:
              host_result: object
          artifacts:
            named_emits: { host_result: host_result }
            packets: { host_result: runx.issue_to_pr.host_result.v1 }

        - id: admit-host-result
          inputs:
            issue_evidence: $input.issue_evidence
          context:
            host_result: host-work.host_result.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: admitHostResult
            outputs:
              host_admission: object

        - id: publish
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          skill: .
          runner: publish
          context:
            host_result: host-work.host_result.data

        - id: finalize-hold
          when:
            field: admit-host-result.host_admission.path
            equals: hold
          context:
            host_result: host-work.host_result.data
            host_admission: admit-host-result.host_admission
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

        - id: finalize-blocked
          when:
            field: admit-host-result.host_admission.path
            equals: blocked
          context:
            host_result: host-work.host_result.data
            host_admission: admit-host-result.host_admission
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

  resume:
    type: graph
    inputs:
      issue_evidence: { definition: issue_evidence }
      host_result: { definition: host_result }
    graph:
      name: issue-to-pr-resume
      result_from: [publish, finalize-hold, finalize-blocked]
      steps:
        - id: admit-host-result
          inputs:
            host_result: $input.host_result
            issue_evidence: $input.issue_evidence
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: admitHostResult
            outputs:
              host_admission: object

        - id: publish
          when:
            field: admit-host-result.host_admission.path
            equals: publish
          skill: .
          runner: publish
          inputs:
            host_result: $input.host_result

        - id: finalize-hold
          when:
            field: admit-host-result.host_admission.path
            equals: hold
          inputs:
            host_result: $input.host_result
          context:
            host_admission: admit-host-result.host_admission
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

        - id: finalize-blocked
          when:
            field: admit-host-result.host_admission.path
            equals: blocked
          inputs:
            host_result: $input.host_result
          context:
            host_admission: admit-host-result.host_admission
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }

  publish:
    type: graph
    inputs:
      host_result: { definition: host_result }
    graph:
      name: issue-to-pr-publish
      result_from: [finalize]
      steps:
        - id: publish-pr
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.host_result.publication.idempotency_key
          scopes: [pr.write]
          policy:
            provider_permission:
              verb: write
          inputs:
            expected_provider: github
            operation: pullrequest.open
            target: $input.host_result.repository
            idempotency_key: $input.host_result.publication.idempotency_key
            result_fields: [repository, number, title, state, body, url, head, base, draft]
            input:
              title: $input.host_result.publication.title
              body: $input.host_result.publication.body
              head: $input.host_result.publication.head
              base: $input.host_result.publication.base
              draft: $input.host_result.publication.draft
            expected_result:
              repository: $input.host_result.repository
              title: $input.host_result.publication.title
              head: $input.host_result.publication.head
              base: $input.host_result.publication.base

        - id: readback-pr
          tool: provider.read
          scopes: [pr.read]
          policy:
            provider_permission:
              verb: read
          inputs:
            expected_provider: github
            operation: pullrequest.read
            target: $input.host_result.repository
            result_fields: [repository, number, title, state, body, url, head, base, draft]
          context:
            input: publish-pr.provider_operation.data.result
            expected_result: publish-pr.provider_operation.data.result

        - id: finalize
          inputs:
            host_result: $input.host_result
          context:
            publication_result: publish-pr.provider_operation.data
            readback_result: readback-pr.provider_operation.data
          run:
            type: javascript
            module: issue-to-pr.mjs
            export: finalizeIssueToPr
            outputs:
              issue_to_pr_result: object
          artifacts:
            named_emits: { issue_to_pr_result: issue_to_pr_result }
            packets: { issue_to_pr_result: runx.issue_to_pr.result.v1 }
