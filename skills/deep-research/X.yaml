skill: deep-research
version: "0.2.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: deep-research-packages-bound-brief-without-publishing
      inputs:
        objective: Identify the strongest architectural signal in the supplied Runx evidence.
        audience: operators
        channel: brief
        domain: agent infrastructure
        source_packets:
          - decision: ready
            final_url: https://example.com/receipts
            status: 200
            content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            extracted: Runx receipts bind operator actions to explicit authority and verification evidence.
            provenance:
              fetched_at: "2026-07-17T00:00:00Z"
              bytes: 82
              truncated: false
              redirects: []
          - decision: ready
            final_url: https://example.com/skills
            status: 200
            content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            extracted: Portable skill packages separate model judgment from deterministic provider operations.
            provenance:
              fetched_at: "2026-07-17T00:01:00Z"
              bytes: 85
              truncated: false
              redirects: []
      caller:
        answers:
          agent_task.research-synthesize.output:
            research_candidate:
              decision: ready
              research_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                scope: agent infrastructure
                summary: The strongest signal is evidence-bound execution packaged behind portable skills.
                open_questions: []
              evidence_log:
                - claim: Receipts bind actions to authority and verification evidence.
                  source_digest: sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  provider_content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  confidence: verified
                  relevance: Establishes the governance half of the architecture.
                - claim: Portable skills separate judgment from deterministic operations.
                  source_digest: sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
                  provider_content_digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  confidence: verified
                  relevance: Establishes the packaging and execution half.
              decision_support:
                - option: Lead with evidence-bound portable execution.
                  rationale: Both supplied sources support the combined architecture.
                  source_digests:
                    - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                    - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              risks: []
          agent_task.ghostwrite-draft.output:
            content_draft:
              decision: ready
              content_brief:
                objective: Identify the strongest architectural signal in the supplied Runx evidence.
                audience: operators
                channel: brief
              draft:
                title: Evidence-bound execution is the architecture
                body: Runx binds operator actions to authority evidence and packages deterministic operations behind portable skills.
                claim_refs:
                  - claim: Receipts bind operator actions to authority evidence.
                    source_digests:
                      - sha256:9056e1b5caa4e78583d0bc47bb731468b31155929a3aa3a35fcadf6136534a36
                  - claim: Portable skills separate judgment from deterministic operations.
                    source_digests:
                      - sha256:c951e0e102215f739709aa280773536f95d4560e1299999af9c2362db6a118dc
              review_checklist:
                - Confirm both source bindings remain present.
              distribution_notes:
                primary_channel: brief
              context_binding: { applied: [] }
      expect:
        status: sealed
        steps:
          - research-topic
          - draft-brief
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
          draft-brief:
            subset:
              content_draft_packet:
                data:
                  decision: ready
                  validation:
                    status: pass
        receipt:
          schema: runx.receipt.v1

    - name: deep-research-stops-before-drafting-without-sources
      inputs:
        objective: Decide whether the supplied claim is ready.
        audience: operators
        channel: brief
        source_packets: []
      expect:
        status: sealed
        steps:
          - research-topic
        step_outputs:
          research-topic:
            subset:
              research_packet:
                data:
                  decision: needs_more_evidence
                  validation:
                    status: fail
        receipt:
          schema: runx.receipt.v1

runners:
  deep-research:
    default: true
    type: graph
    inputs:
      objective:
        type: string
        required: true
        description: Exact decision question the brief must answer.
      source_packets:
        type: json
        required: true
        description: Bounded governed source packets, normally runx.fetch.v1 evidence.
      audience:
        type: string
        required: false
        default: operators
        description: Primary reader for the decision brief.
      channel:
        type: string
        required: false
        default: brief
        description: Local package format; this runner does not deliver it.
      domain:
        type: string
        required: false
        description: Domain context for interpretation.
      operator_context:
        type: string
        required: false
        description: Local constraints that do not count as evidence.
      target_entities:
        type: json
        required: false
        description: Entities to include or compare.
    graph:
      name: deep-research
      result_from: [research-topic, draft-brief]
      steps:
        - id: research-topic
          skill: ../research
          scopes:
            - runx:research:read
          inputs:
            objective: $input.objective
            source_packets: $input.source_packets
            domain: $input.domain
            deliverable: deep research brief
            operator_context: $input.operator_context
            target_entities: $input.target_entities

        - id: draft-brief
          when:
            field: research-topic.research_packet.data.decision
            equals: ready
          skill: ../ghostwrite
          scopes:
            - runx:content:draft
          inputs:
            objective: $input.objective
            audience: $input.audience
            channel: $input.channel
            voice_guide: Lead with the decision, distinguish verified evidence from inference, and preserve open questions.
          context:
            evidence_pack: research-topic.research_packet.data
