skill: refund
version: "0.3.0"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none
runners:
  mock:
    default: true
    type: graph
    inputs:
      original_receipt_ref:
        type: string
        required: true
        description: Opaque sealed charge receipt reference.
      refund_request:
        type: object
        required: true
        description: Positive minor-unit amount, opaque reason, and optional recorded payer check.
      parent_payment_authority:
        type: object
        required: true
        description: Full typed parent refund AuthorityTerm; a reference alone is refused.
    graph:
      name: refund-mock-plan
      result_from: [prepare]
      steps:
        - id: prepare
          tool: payment.refund_plan
          inputs:
            original_receipt_ref: $input.original_receipt_ref
            refund_request: $input.refund_request
            settlement_family: mock
            parent_payment_authority: $input.parent_payment_authority
  mpp:
    default: false
    type: graph
    inputs:
      original_receipt_ref:
        type: string
        required: true
        description: Opaque sealed charge receipt reference.
      refund_request:
        type: object
        required: true
        description: Positive minor-unit amount, opaque reason, and optional recorded payer check.
      parent_payment_authority:
        type: object
        required: true
        description: Full typed parent refund AuthorityTerm; a reference alone is refused.
    graph:
      name: refund-mpp-plan
      result_from: [prepare]
      steps:
        - id: prepare
          tool: payment.refund_plan
          inputs:
            original_receipt_ref: $input.original_receipt_ref
            refund_request: $input.refund_request
            settlement_family: mpp
            parent_payment_authority: $input.parent_payment_authority
  stripe:
    default: false
    type: graph
    inputs:
      original_receipt_ref:
        type: string
        required: true
        description: Opaque sealed charge receipt reference.
      refund_request:
        type: object
        required: true
        description: Positive minor-unit amount, opaque reason, and optional recorded payer check.
      parent_payment_authority:
        type: object
        required: true
        description: Full typed parent refund AuthorityTerm; a reference alone is refused.
    graph:
      name: refund-stripe-plan
      result_from: [prepare]
      steps:
        - id: prepare
          tool: payment.refund_plan
          inputs:
            original_receipt_ref: $input.original_receipt_ref
            refund_request: $input.refund_request
            settlement_family: stripe
            parent_payment_authority: $input.parent_payment_authority
