skill: dispute-respond
version: "0.4.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  runtime_path: dispute-provider
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required

runners:
  respond:
    default: true
    type: graph
    inputs:
      dispute_event:
        type: object
        required: true
        description: Normalized provider dispute event.
      original_receipt_id:
        type: string
        required: true
        description: Exact Runx receipt id for the original charge.
      prior_refund_receipt_ids:
        type: json
        required: false
        description: Exact Runx receipt ids for prior refunds.
      evidence_refs:
        type: json
        required: false
        description: Bounded evidence refs with sha256 digest, kind, and summary.
      operator_posture:
        type: string
        required: false
        description: Optional preferred posture; evidence remains authoritative.
    graph:
      name: dispute-respond
      steps:
        - id: admit
          inputs:
            dispute_event: $input.dispute_event
            original_receipt_id: $input.original_receipt_id
            prior_refund_receipt_ids: $input.prior_refund_receipt_ids
            evidence_refs: $input.evidence_refs
            operator_posture: $input.operator_posture
          run:
            type: javascript
            module: dispute-respond.mjs
            export: admitDispute
            outputs:
              dispute_context: object
          artifacts:
            named_emits:
              dispute_context: dispute_context

        - id: evidence
          when:
            field: admit.dispute_context.data.path
            equals: review
          tool: receipt.prove
          context:
            receipt_ids: admit.dispute_context.data.receipt_ids

        - id: draft
          when:
            field: admit.dispute_context.data.path
            equals: review
          run:
            type: agent-task
            agent: operator
            task: dispute-response-draft
            outputs:
              response_draft: object
          context:
            dispute_context: admit.dispute_context.data
            receipt_proof: evidence.receipt_proof.data
          artifacts:
            named_emits:
              response_draft: response_draft

        - id: finalize
          when:
            field: admit.dispute_context.data.path
            equals: review
          context:
            dispute_context: admit.dispute_context.data
            receipt_proof: evidence.receipt_proof.data
            response_draft: draft.response_draft.data
          run:
            type: javascript
            module: dispute-respond.mjs
            export: finalizeResponse
            outputs:
              dispute_packet: object
          artifacts:
            named_emits:
              dispute_packet: dispute_packet
            packets:
              dispute_packet: runx.payment.dispute_response.v1

        - id: stop
          when:
            field: admit.dispute_context.data.path
            equals: stop
          context:
            dispute_context: admit.dispute_context.data
          run:
            type: javascript
            module: dispute-respond.mjs
            export: finalizeResponse
            outputs:
              dispute_packet: object
          artifacts:
            named_emits:
              dispute_packet: dispute_packet
            packets:
              dispute_packet: runx.payment.dispute_response.v1

  file:
    type: graph
    inputs:
      dispute_packet:
        type: object
        required: true
        description: Exact validated runx.payment.dispute_response.v1 packet produced by respond.
      provider:
        type: string
        required: true
        description: Expected configured payment provider name.
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact dispute filing.
    graph:
      name: dispute-respond-file
      steps:
        - id: validate
          tool: data.compare
          inputs:
            actual:
              schema: $input.dispute_packet.schema
              decision: $input.dispute_packet.decision
              validation_status: $input.dispute_packet.validation.status
              provider: $input.dispute_packet.filing.provider
              filing_status: $input.dispute_packet.filing.status
              provider_status: $input.dispute_packet.filing.provider_status
              approval_status: $input.dispute_packet.filing.approval_status
            expected:
              schema: runx.payment.dispute_response.v1
              decision: ready_for_review
              validation_status: pass
              provider: $input.provider
              filing_status: not_filed
              provider_status: not_called
              approval_status: not_requested

        - id: digest-request
          when:
            field: validate.comparison.data.equal
            equals: true
          tool: data.digest
          inputs:
            value: $input.dispute_packet

        - id: file-response
          when:
            field: validate.comparison.data.equal
            equals: true
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_key
          scopes:
            - dispute.file
          policy:
            provider_permission:
              verb: write
          inputs:
            operation: dispute.file
            target: $input.dispute_packet.dispute.dispute_id
            expected_provider: $input.provider
            idempotency_key: $input.idempotency_key
            expected_result:
              dispute_id: $input.dispute_packet.dispute.dispute_id
            result_fields: [dispute_id, filing_ref, request_digest, status]
            input:
              dispute_packet: $input.dispute_packet

        - id: bind-request
          when:
            field: validate.comparison.data.equal
            equals: true
          tool: data.compare
          context:
            expected: digest-request.digest_result.data.digest
            actual: file-response.provider_operation.data.result.request_digest

        - id: readback
          when:
            field: bind-request.comparison.data.equal
            equals: true
          tool: provider.read
          scopes:
            - dispute.read
          policy:
            provider_permission:
              verb: read
          inputs:
            operation: dispute.read
            target: $input.dispute_packet.dispute.dispute_id
            expected_provider: $input.provider
            result_fields: [dispute_id, filing_ref, request_digest, status]
          context:
            expected_result: file-response.provider_operation.data.result
            input: file-response.provider_operation.data.result
