skill: taste-profile
version: "0.2.0"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none

runners:
  profile:
    default: true
    type: graph
    inputs:
      subject:
        type: string
        required: true
        description: Person, team, product, or audience whose taste is modeled.
      evidence:
        type: json
        required: true
        description: At least two bounded typed preference examples.
      surface:
        type: string
        required: false
        description: Surface where the packet applies.
      audience:
        type: string
        required: false
        description: Intended downstream audience.
      constraints:
        type: json
        required: false
        description: Policy, accessibility, legal, or operational boundaries.
    graph:
      name: taste-profile
      steps:
        - id: index
          inputs:
            subject: $input.subject
            evidence: $input.evidence
          run:
            type: javascript
            module: taste-profile.mjs
            export: indexEvidence
            outputs:
              evidence_index: object
          artifacts:
            named_emits:
              evidence_index: evidence_index

        - id: digest
          tool: data.digest
          context:
            value: index.evidence_index.data.sources

        - id: reject
          when:
            field: index.evidence_index.data.decision
            equals: needs_more_evidence
          inputs:
            subject: $input.subject
            surface: $input.surface
            audience: $input.audience
          context:
            evidence_index: index.evidence_index.data
            evidence_digest: digest.digest_result.data.digest
          run:
            type: javascript
            module: taste-profile.mjs
            export: finalizeProfile
            outputs:
              taste_profile_packet: object
          artifacts:
            named_emits:
              taste_profile_packet: taste_profile_packet
            packets:
              taste_profile_packet: runx.context.taste_profile.v1

        - id: synthesize
          when:
            field: index.evidence_index.data.decision
            equals: ready
          run:
            type: agent-task
            agent: curator
            task: taste-profile-synthesize
            outputs:
              taste_profile_draft: object
          inputs:
            subject: $input.subject
            surface: $input.surface
            audience: $input.audience
            constraints: $input.constraints
          context:
            evidence_index: index.evidence_index.data
            evidence_digest: digest.digest_result.data.digest
          artifacts:
            named_emits:
              taste_profile_draft: taste_profile_draft

        - id: finalize
          when:
            field: index.evidence_index.data.decision
            equals: ready
          inputs:
            subject: $input.subject
            surface: $input.surface
            audience: $input.audience
          context:
            evidence_index: index.evidence_index.data
            evidence_digest: digest.digest_result.data.digest
            taste_profile_draft: synthesize.taste_profile_draft.data
          run:
            type: javascript
            module: taste-profile.mjs
            export: finalizeProfile
            outputs:
              taste_profile_packet: object
          artifacts:
            named_emits:
              taste_profile_packet: taste_profile_packet
            packets:
              taste_profile_packet: runx.context.taste_profile.v1
