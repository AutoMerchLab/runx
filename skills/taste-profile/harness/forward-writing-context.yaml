name: taste-profile-forward-writing-context
steps:
  - id: taste
    skill: ..
    runner: profile
    inputs:
      subject: runx maintainer
      surface: public product writing
      audience: advanced software builders
      evidence:
        - { kind: liked, content: Dense operational surfaces with visible proof. }
        - { kind: disliked, content: Decorative marketing cards that hide the workflow. }
  - id: draft
    skill: ../../ghostwrite
    runner: draft
    inputs:
      objective: Explain the strongest Runx architecture signal.
      audience: operators
      channel: brief
      evidence_pack:
        decision: ready
        research_brief: { objective: Explain the strongest Runx architecture signal. }
        evidence_log:
          - { claim: Receipts bind actions to authority evidence., source_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111 }
        source_evidence:
          - { evidence_digest: sha256:1111111111111111111111111111111111111111111111111111111111111111 }
        validation: { status: pass, findings: [] }
    context:
      taste_context: taste.taste_profile_packet.data
  - id: social-plan
    skill: ../../twitter
    runner: plan
    inputs:
      objective: Prepare one exact public update about governed receipts.
      principal: account:@runx
    context:
      brand_context: taste.taste_profile_packet.data
