skill: spend
version: "0.3.0"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
runners:
  plan:
    default: false
    type: graph
    inputs:
      payment_signal:
        type: object
        required: true
        description: Payment-required signal or challenge.
      parent_payment_authority:
        type: object
        required: true
        description: Full typed parent payment AuthorityTerm; a reference alone is refused.
      realm:
        type: string
        required: false
        description: Authority realm.
      rail_preferences:
        type: json
        required: false
        description: Ordered rail allowlist used to narrow the parent authority.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned idempotency material.
    graph:
      name: spend-plan
      result_from: [quote]
      steps:
        - id: quote
          skill: graph/pay-quote
          runner: quote
          scopes:
            - payment:quote
          inputs:
            payment_signal: $input.payment_signal
            realm: $input.realm
            rail_preferences: $input.rail_preferences
            idempotency_seed: $input.idempotency_seed
            parent_payment_authority: $input.parent_payment_authority
          artifacts:
            wrap_as: payment_quote_packet
            packet: runx.payment.quote.v1
  mock:
    default: true
    type: graph
    inputs:
      payment_signal:
        type: object
        required: true
        description: Payment-required signal or challenge.
      parent_payment_authority:
        type: object
        required: true
        description: Full typed parent payment AuthorityTerm; a reference alone is refused.
      rail_profile_ref:
        type: string
        required: true
        description: Configured rail profile reference.
      payment_admission:
        type: object
        required: false
        description: Hosted payment admission token and settlement identity.
      realm:
        type: string
        required: false
        description: Authority realm.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned idempotency material.
    graph:
      name: spend
      result_from: [fulfill]
      steps:
        - id: quote
          skill: graph/pay-quote
          runner: quote
          scopes:
            - payment:quote
          inputs:
            payment_signal: $input.payment_signal
            realm: $input.realm
            idempotency_seed: $input.idempotency_seed
            parent_payment_authority: $input.parent_payment_authority
          artifacts:
            wrap_as: payment_quote_packet
            packet: runx.payment.quote.v1
        - id: reserve
          skill: graph/pay-reserve
          runner: reserve
          scopes:
            - payment:reserve
          mutation: true
          idempotency_key: pay-reserve
          inputs:
            parent_payment_authority: $input.parent_payment_authority
            idempotency_seed: $input.idempotency_seed
            target_harness_ref:
              type: harness
              uri: runx:harness:spend
            target_act_id: act_fulfill
          context:
            payment_quote_packet: quote.payment_quote_packet.data
          artifacts:
            wrap_as: payment_reservation_packet
            packet: runx.payment.reservation.v1
        - id: approve-spend
          run:
            type: approval
          inputs:
            gate_id: spend.mock.approval
            reason: Approve the reserved mock spend before the rail runner receives spend authority.
          context:
            payment_decision: reserve.payment_reservation_packet.data.payment_decision
            reserved_payment_authority: reserve.payment_reservation_packet.data.reserved_payment_authority
          artifacts:
            wrap_as: payment_approval
            packet: runx.payment.approval.v1
        - id: fulfill
          skill: graph/pay-fulfill-rail
          runner: mock
          scopes:
            - payment:spend
          mutation: true
          idempotency_key: spend-mock-fulfill
          inputs:
            payment_challenge: $input.payment_signal
            rail_profile_ref: $input.rail_profile_ref
            payment_admission: $input.payment_admission
          context:
            reserved_payment_authority: reserve.payment_reservation_packet.data.reserved_payment_authority
            spend_capability_ref: reserve.payment_reservation_packet.data.spend_capability_ref
            idempotency: reserve.payment_reservation_packet.data.idempotency
            quote_packet: quote.payment_quote_packet.data
      policy:
        guards:
          - step: fulfill
            field: approve-spend.payment_approval.data.approved
            equals: true
