skill: charge
version: "0.3.0"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none
runners:
  mock:
    default: true
    type: graph
    inputs:
      mcp_tool_call:
        type: object
        required: true
        description: Inbound MCP operation request.
      provider_policy:
        type: object
        required: true
        description: Provider-owned price and settlement-family policy.
      returned_credential:
        type: object
        required: true
        description: Opaque mock credential family and reference.
      verify_capability_ref:
        type: string
        required: true
        description: Single-use verifier capability reference.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned challenge seed.
    graph:
      name: charge-mock-plan
      result_from: [finalize]
      steps:
        - id: price
          skill: graph/charge-price
          runner: price
          inputs:
            mcp_tool_call: $input.mcp_tool_call
            provider_policy: $input.provider_policy
        - id: challenge
          skill: graph/charge-challenge
          runner: challenge
          inputs:
            idempotency_seed: $input.idempotency_seed
          context:
            charge_price_packet: price.charge_price_packet.data
        - id: verify
          skill: graph/charge-verify
          runner: verify
          inputs:
            returned_credential: $input.returned_credential
            verify_capability_ref: $input.verify_capability_ref
            settlement_family: mock
          context:
            charge_price_packet: price.charge_price_packet.data
            charge_challenge_packet: challenge.charge_challenge_packet.data
            idempotency: challenge.charge_challenge_packet.data.idempotency
        - id: finalize
          tool: payment.charge_plan
          context:
            charge_price_packet: price.charge_price_packet.data
            charge_challenge_packet: challenge.charge_challenge_packet.data
            charge_verification_request: verify.charge_verification_request.data
    runx:
      payment_authority:
        direction: provider_charge
        phase: plan
        settlement_family: mock
        receipt_before_forward_required: true
        runtime_forwarding_enabled: false
  mpp:
    default: false
    type: graph
    inputs:
      mcp_tool_call:
        type: object
        required: true
        description: Inbound MCP operation request.
