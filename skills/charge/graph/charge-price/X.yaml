skill: charge-price
version: 0.3.0
catalog:
  kind: graph
  audience: operator
  visibility: internal
  role: graph-stage
  part_of:
    - runx/charge
runners:
  price:
    default: true
    type: graph
    inputs:
      mcp_tool_call:
        type: object
        required: true
        description: Inbound MCP operation request.
      provider_policy:
        type: object
        required: true
        description: Provider-owned price and settlement-family policy.
    graph:
      name: charge-price
      steps:
        - id: price
          tool: payment.charge_price
          inputs:
            mcp_tool_call: $input.mcp_tool_call
            provider_policy: $input.provider_policy
