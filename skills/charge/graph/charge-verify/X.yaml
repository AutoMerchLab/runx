skill: charge-verify
version: 0.3.0
catalog:
  kind: graph
  audience: operator
  visibility: internal
  role: graph-stage
  part_of:
    - runx/charge
  execution: plan
  completion: plan
  requires_adapter: true
  approval: none
runners:
  verify:
    default: true
    type: graph
    inputs:
      charge_price_packet:
        type: object
        required: true
        description: Native charge-price packet data.
      charge_challenge_packet:
        type: object
        required: true
        description: Native charge-challenge packet data.
      returned_credential:
        type: object
        required: true
        description: Opaque credential family and reference only.
      verify_capability_ref:
        type: string
        required: true
        description: Single-use verifier capability reference.
      settlement_family:
        type: string
        required: true
        description: Selected settlement family.
      idempotency:
        type: object
        required: true
        description: Challenge idempotency binding.
    graph:
      name: charge-verify
      steps:
        - id: verify
          tool: payment.charge_verification_request
          inputs:
            charge_price_packet: $input.charge_price_packet
            charge_challenge_packet: $input.charge_challenge_packet
            returned_credential: $input.returned_credential
            verify_capability_ref: $input.verify_capability_ref
            settlement_family: $input.settlement_family
            idempotency: $input.idempotency
