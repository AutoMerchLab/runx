name: charge-stripe-path
kind: skill
target: ..
runner: stripe
operator_journeys:
  - mode: standalone
    request: Charge for this paid search call through the admitted Stripe settlement path.
    expected_outcome: Validate price and authority, settle once, and return verification evidence.
  - mode: composed
    request: Continue charging from this admitted paid-call request and provider policy.
    expected_outcome: Reuse the tool call, quote policy, and settlement choice without repricing or duplicating the charge.
    prior_evidence:
      - The admitted tool call and pricing policy supplied in the fixture.
    must_not_repeat:
      - Do not reprice the paid call.
      - Do not charge again after settlement evidence exists.
inputs:
  mcp_tool_call:
    tool: search.paid
    arguments: { query: runx }
  provider_policy:
    price_minor: 125
    currency: USD
    accepted_settlement_families: [stripe]
    counterparty: provider:demo
    realm: test
  returned_credential:
    family: stripe
    credential_ref: credential:stripe:paid-search-001
  verify_capability_ref: capability:charge-verify:paid-search-001
  idempotency_seed: paid-search-001
expect:
  status: sealed
  steps: [price, challenge, verify, finalize]
  step_outputs:
    finalize:
      subset:
        charge_plan:
          data:
            decision: ready_for_provider_verification
            forwarding_status: not_forwarded
  receipt: { schema: runx.receipt.v1 }
metadata:
  public_skill: charge
  source_case: charge-stripe-path
  source: skills-fixture
