skill: redact-pii
version: "0.2.0"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: canonical
  execution: read
  completion: runtime_receipt
  requires_adapter: false
  approval: none
runners:
  redact-pii:
    default: true
    type: graph
    inputs:
      content:
        type: string
        required: true
        description: Content to inspect and scrub before it crosses a trust boundary.
      classes:
        type: json
        required: false
        description: Personal-data classes to target; omitted classes use the broad default policy.
      mode:
        type: string
        required: false
        description: "Treatment to apply: redact, tokenize, or block. Defaults to redact."
      locale:
        type: string
        required: false
        description: Locale for semantic identifier and address judgment.
      operator_context:
        type: string
        required: false
        description: Boundary purpose and risk posture for the review pass.
    graph:
      name: redact-pii
      steps:
        - id: detect
          label: detect personal-data spans and semantic risk
          run:
            type: agent-task
            agent: reviewer
            task: redact-pii-detect
            outputs:
              redaction_draft: object
          inputs:
            content: $input.content
            classes: $input.classes
            mode: $input.mode
            locale: $input.locale
            operator_context: $input.operator_context
          instructions: >
            Inspect only the supplied content. Return redaction_draft with
            decision (ready, needs_review, or blocked), detected spans as class,
            UTF-16 start/end offsets, and confidence, plus residual_risk with
            level and reason_code. Never include matched values. Use reason_code
            none, ambiguous_semantics, scrubbing_destroys_meaning, policy_block,
            or insufficient_context. The deterministic finalizer owns all
            replacements, scanning, digests, and the final pass gate.
          artifacts:
            named_emits:
              redaction_draft: redaction_draft
        - id: finalize
          label: scrub and scan residual content
          inputs:
            content: $input.content
            classes: $input.classes
            mode: $input.mode
            locale: $input.locale
          context:
            redaction_draft: detect.redaction_draft.data
          run:
            type: cli-tool
            command: node
            args:
              - ./finalize_redaction.mjs
            outputs:
              redaction_report: object
              redacted_content: string
          artifacts:
            named_emits:
              redaction_report: redaction_report
            packets:
              redaction_report: runx.redaction.report.v1
