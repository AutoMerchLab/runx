skill: x402-pay
version: "0.3.0"
catalog:
  kind: graph
  audience: operator
  visibility: public
  role: branded
  canonical_skill: runx/spend
  provider: x402
  runtime_path: x402
  execution: plan
  completion: plan
  requires_adapter: false
  approval: none
runners:
  x402:
    default: true
    type: graph
    inputs:
      payment_signal:
        type: object
        required: true
        description: Payment-required signal or challenge.
      parent_payment_authority:
        type: object
        required: true
        description: Full typed parent payment AuthorityTerm; a reference alone is refused.
      realm:
        type: string
        required: false
        description: Authority realm.
      idempotency_seed:
        type: string
        required: true
        description: Stable caller-owned idempotency material.
    graph:
      name: x402-pay
      result_from: [spend]
      steps:
        - id: spend
          skill: ../spend
          runner: plan
          inputs:
            payment_signal: $input.payment_signal
            parent_payment_authority: $input.parent_payment_authority
            rail_preferences: [x402]
            realm: $input.realm
            idempotency_seed: $input.idempotency_seed
