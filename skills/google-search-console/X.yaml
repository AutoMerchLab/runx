skill: google-search-console
version: "0.1.2"

catalog:
  kind: graph
  audience: public
  visibility: public
  role: branded
  canonical_skill: runx/organic-growth
  provider: google-search-console
  runtime_path: provider
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: conditional

harness:
  cases:
    - name: normalizes-bounded-page-performance
      runner: normalize-performance
      inputs:
        request:
          property: https://example.com/
          start_date: "2026-06-01"
          end_date: "2026-06-30"
          dimensions: [page]
          search_type: web
          data_state: final
        provider_result:
          property: https://example.com/
          start_date: "2026-06-01"
          end_date: "2026-06-30"
          dimensions: [page]
          search_type: web
          data_state: final
          aggregation_type: byPage
          rows:
            - keys: [https://example.com/guides/runx]
              clicks: 42
              impressions: 600
              ctr: 0.07
              position: 4.2
          row_count: 1
          pagination: { complete: true, returned_rows: 1 }
          fetched_at: "2026-07-01T02:00:00Z"
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              performance_evidence:
                data:
                  schema: runx.search.performance.evidence.v1
                  decision: ready
                  provider: google-search-console
                  provider_status: not_called
                  source_status: supplied_result
                  property: https://example.com/
                  row_count: 1
                  pagination: { complete: true, returned_rows: 1 }
                  rows:
                    - dimensions: { page: https://example.com/guides/runx }
                      metrics: { clicks: 42, impressions: 600, ctr: 0.07, position: 4.2 }
                  freshness: { complete: true, data_state: final }
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: defaults-omitted-dimensions-to-page
      runner: normalize-performance
      inputs:
        request:
          property: https://example.com/
          start_date: "2026-06-01"
          end_date: "2026-06-30"
          search_type: web
          data_state: final
        provider_result:
          property: https://example.com/
          start_date: "2026-06-01"
          end_date: "2026-06-30"
          dimensions: [page]
          search_type: web
          data_state: final
          aggregation_type: byPage
          rows:
            - keys: [https://example.com/default-page]
              clicks: 2
              impressions: 20
              ctr: 0.1
              position: 3.5
          row_count: 1
          pagination: { complete: true, returned_rows: 1 }
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              performance_evidence:
                data:
                  decision: ready
                  request:
                    dimensions: [page]
                  rows:
                    - dimensions: { page: https://example.com/default-page }
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: preserves-hourly-data-on-http-prefix-property
      runner: normalize-performance
      inputs:
        request:
          property: http://example.com/
          start_date: "2026-07-19"
          end_date: "2026-07-20"
          dimensions: [hour]
          search_type: web
          data_state: hourly_all
        provider_result:
          property: http://example.com/
          start_date: "2026-07-19"
          end_date: "2026-07-20"
          dimensions: [hour]
          search_type: web
          data_state: hourly_all
          rows:
            - keys: ["2026-07-19T23:00:00-07:00"]
              clicks: 1
              impressions: 10
              ctr: 0.1
              position: 2
          row_count: 1
          pagination: { complete: true, returned_rows: 1 }
          metadata:
            first_incomplete_hour: "2026-07-19T23:00:00-07:00"
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              performance_evidence:
                data:
                  decision: usable_with_caveats
                  property: http://example.com/
                  request:
                    dimensions: [hour]
                    data_state: hourly_all
                  rows:
                    - dimensions: { hour: "2026-07-19T23:00:00-07:00" }
                  freshness:
                    complete: false
                    first_incomplete_hour: "2026-07-19T23:00:00-07:00"
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: blocks-hourly-data-without-hour-dimension
      runner: normalize-performance
      inputs:
        request:
          property: https://example.com/
          start_date: "2026-07-19"
          end_date: "2026-07-20"
          dimensions: [page]
          search_type: web
          data_state: hourly_all
        provider_result:
          property: https://example.com/
          start_date: "2026-07-19"
          end_date: "2026-07-20"
          dimensions: [page]
          search_type: web
          data_state: hourly_all
          rows: []
          row_count: 0
          pagination: { complete: true, returned_rows: 0 }
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              performance_evidence:
                data:
                  decision: blocked
                  validation:
                    status: fail
                    findings:
                      - code: gsc.hourly_all.hour_dimension_missing
        receipt: { schema: runx.receipt.v1 }

    - name: plans-http-prefix-sitemap-without-submitting
      runner: plan-sitemap
      inputs:
        property: http://example.com/
        sitemap_url: http://example.com/sitemap.xml
      expect:
        status: sealed
        steps: [prepare, digest, bind]
        step_outputs:
          bind:
            subset:
              sitemap_plan:
                data:
                  decision: ready_for_approval
                  property: http://example.com/
                  sitemap_url: http://example.com/sitemap.xml
                  provider_status: not_called
                  external_status: not_submitted
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: preserves-incomplete-data-caveat
      runner: normalize-performance
      inputs:
        request:
          property: sc-domain:example.com
          start_date: "2026-07-01"
          end_date: "2026-07-19"
          dimensions: [query]
          search_type: web
          data_state: all
        provider_result:
          property: sc-domain:example.com
          start_date: "2026-07-01"
          end_date: "2026-07-19"
          dimensions: [query]
          search_type: web
          data_state: all
          aggregation_type: auto
          rows:
            - keys: [runx operator]
              clicks: 3
              impressions: 50
              ctr: 0.06
              position: 8.5
          row_count: 1
          pagination: { complete: true, returned_rows: 1 }
          metadata: { first_incomplete_date: "2026-07-18" }
      expect:
        status: sealed
        steps: [normalize, digest, finalize]
        step_outputs:
          finalize:
            subset:
              performance_evidence:
                data:
                  decision: usable_with_caveats
                  provider_status: not_called
                  freshness:
                    complete: false
                    data_state: all
                    first_incomplete_date: "2026-07-18"
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

    - name: refuses-general-indexing-request
      runner: plan-indexing
      inputs:
        url: https://example.com/blog/new-post
        resource_type: article
        reason: Ask Google to index a newly published article.
      expect:
        status: sealed
        steps: [classify]
        step_outputs:
          classify:
            subset:
              indexing_admission:
                data:
                  schema: runx.search.indexing_admission.v1
                  decision: refused
                  reason_code: unsupported_resource_type
                  provider_status: not_called
                  external_status: not_requested
        receipt: { schema: runx.receipt.v1 }

    - name: plans-exact-sitemap-without-submitting
      runner: plan-sitemap
      inputs:
        property: sc-domain:example.com
        sitemap_url: https://www.example.com/sitemap.xml
      expect:
        status: sealed
        steps: [prepare, digest, bind]
        step_outputs:
          bind:
            subset:
              sitemap_plan:
                data:
                  schema: runx.search.sitemap_plan.v1
                  decision: ready_for_approval
                  provider: google-search-console
                  operation: sitemaps.submit
                  property: sc-domain:example.com
                  sitemap_url: https://www.example.com/sitemap.xml
                  provider_status: not_called
                  external_status: not_submitted
                  validation: { status: pass }
        receipt: { schema: runx.receipt.v1 }

runners:
  performance:
    default: true
    type: graph
    inputs:
      property:
        type: string
        required: true
        description: Exact Search Console HTTP(S) URL-prefix or sc-domain property.
      start_date:
        type: string
        required: true
        description: Inclusive YYYY-MM-DD start date.
      end_date:
        type: string
        required: true
        description: Inclusive YYYY-MM-DD end date.
      dimensions:
        type: json
        required: false
        default: [page]
        description: Ordered subset of query, page, country, device, date, hour, and searchAppearance; defaults to page.
      search_type:
        type: string
        required: false
        default: web
        description: Search type such as web, image, video, news, googleNews, or discover.
      data_state:
        type: string
        required: false
        default: final
        description: final, all, or hourly_all; hourly_all requires the hour dimension.
      row_limit:
        type: integer
        required: false
        default: 1000
        description: Bounded result row limit, at most 25000.
      start_row:
        type: integer
        required: false
        default: 0
        description: Zero-based pagination offset.
    graph:
      name: google-search-console-performance
      steps:
        - id: read
          tool: provider.read
          scopes: [search.analytics.read]
          policy:
            provider_permission: { verb: read }
          inputs:
            operation: search.analytics.query
            target: $input.property
            expected_provider: google-search-console
            result_fields: [property, start_date, end_date, dimensions, search_type, data_state, rows, row_count, aggregation_type, metadata, pagination, fetched_at]
            input:
              property: $input.property
              start_date: $input.start_date
              end_date: $input.end_date
              dimensions: $input.dimensions
              search_type: $input.search_type
              data_state: $input.data_state
              row_limit: $input.row_limit
              start_row: $input.start_row
        - id: normalize
          inputs:
            source_status: provider_readback
            request:
              property: $input.property
              start_date: $input.start_date
              end_date: $input.end_date
              dimensions: $input.dimensions
              search_type: $input.search_type
              data_state: $input.data_state
              row_limit: $input.row_limit
              start_row: $input.start_row
          context:
            provider_result: read.provider_operation.data.result
          run:
            type: javascript
            module: google-search-console.mjs
            export: normalizePerformance
            outputs:
              performance_draft: object
        - id: digest
          tool: data.digest
          context:
            value: normalize.performance_draft
        - id: finalize
          context:
            performance_draft: normalize.performance_draft
            digest_result: digest.digest_result.data
          run:
            type: javascript
            module: google-search-console.mjs
            export: finalizePerformance
            outputs:
              performance_evidence: object
          artifacts:
            named_emits: { performance_evidence: performance_evidence }

  normalize-performance:
    type: graph
    inputs:
      provider_result:
        type: json
        required: true
        description: Search Console-shaped result already obtained from a trusted source.
      request:
        type: json
        required: false
        description: Expected request identity used to bind the supplied result.
    graph:
      name: google-search-console-normalize-performance
      steps:
        - id: normalize
          inputs:
            provider_result: $input.provider_result
            request: $input.request
            source_status: supplied_result
          run:
            type: javascript
            module: google-search-console.mjs
            export: normalizePerformance
            outputs:
              performance_draft: object
        - id: digest
          tool: data.digest
          context:
            value: normalize.performance_draft
        - id: finalize
          context:
            performance_draft: normalize.performance_draft
            digest_result: digest.digest_result.data
          run:
            type: javascript
            module: google-search-console.mjs
            export: finalizePerformance
            outputs:
              performance_evidence: object
          artifacts:
            named_emits: { performance_evidence: performance_evidence }

  sites:
    type: graph
    inputs: {}
    graph:
      name: google-search-console-sites
      steps:
        - id: read
          tool: provider.read
          scopes: [sites.read]
          policy:
            provider_permission: { verb: read }
          inputs:
            operation: sites.list
            target: google-search-console://sites
            expected_provider: google-search-console
            result_fields: [sites]
            input: {}

  inspect-url:
    type: graph
    inputs:
      property:
        type: string
        required: true
        description: Exact Search Console property.
      inspection_url:
        type: string
        required: true
        description: Canonical URL within the property.
      language_code:
        type: string
        required: false
        default: en-US
        description: Requested issue-message language.
    graph:
      name: google-search-console-inspect-url
      steps:
        - id: read
          tool: provider.read
          scopes: [url.inspect]
          policy:
            provider_permission: { verb: read }
          inputs:
            operation: url.inspect
            target: $input.inspection_url
            expected_provider: google-search-console
            result_fields: [property, inspection_url, verdict, coverage_state, robots_txt_state, indexing_state, page_fetch_state, crawled_as, last_crawl_time, referring_urls, sitemap, amp, mobile_usability, rich_results, inspection_link, fetched_at]
            input:
              property: $input.property
              inspection_url: $input.inspection_url
              language_code: $input.language_code
        - id: normalize
          inputs:
            request:
              property: $input.property
              inspection_url: $input.inspection_url
              language_code: $input.language_code
          context:
            provider_result: read.provider_operation.data.result
          run:
            type: javascript
            module: google-search-console.mjs
            export: normalizeInspection
            outputs:
              inspection_draft: object
        - id: digest
          tool: data.digest
          context:
            value: normalize.inspection_draft
        - id: finalize
          context:
            inspection_draft: normalize.inspection_draft
            digest_result: digest.digest_result.data
          run:
            type: javascript
            module: google-search-console.mjs
            export: finalizeInspection
            outputs:
              inspection_evidence: object
          artifacts:
            named_emits: { inspection_evidence: inspection_evidence }

  sitemaps:
    type: graph
    inputs:
      property:
        type: string
        required: true
        description: Exact Search Console property.
    graph:
      name: google-search-console-sitemaps
      steps:
        - id: read
          tool: provider.read
          scopes: [sitemaps.read]
          policy:
            provider_permission: { verb: read }
          inputs:
            operation: sitemaps.list
            target: $input.property
            expected_provider: google-search-console
            result_fields: [property, sitemaps]
            input: { property: $input.property }

  plan-sitemap:
    type: graph
    inputs:
      property:
        type: string
        required: true
        description: Exact Search Console property.
      sitemap_url:
        type: string
        required: true
        description: Absolute HTTP(S) sitemap URL covered by the property.
    graph:
      name: google-search-console-plan-sitemap
      steps:
        - id: prepare
          inputs:
            property: $input.property
            sitemap_url: $input.sitemap_url
          run:
            type: javascript
            module: google-search-console.mjs
            export: prepareSitemapPlan
            outputs:
              sitemap_plan_draft: object
              digest_subject: object
        - id: digest
          tool: data.digest
          context:
            value: prepare.digest_subject
        - id: bind
          context:
            sitemap_plan_draft: prepare.sitemap_plan_draft
            digest_result: digest.digest_result.data
          run:
            type: javascript
            module: google-search-console.mjs
            export: bindSitemapPlan
            outputs:
              sitemap_plan: object
          artifacts:
            named_emits: { sitemap_plan: sitemap_plan }

  submit-sitemap:
    type: graph
    inputs:
      sitemap_plan:
        type: json
        required: true
        description: Exact sitemap_plan from plan-sitemap.
      idempotency_key:
        type: string
        required: true
        description: Stable UUID for this unchanged sitemap submission.
    graph:
      name: google-search-console-submit-sitemap
      steps:
        - id: digest
          tool: data.digest
          inputs:
            value:
              provider: $input.sitemap_plan.provider
              operation: $input.sitemap_plan.operation
              property: $input.sitemap_plan.property
              sitemap_url: $input.sitemap_plan.sitemap_url
        - id: admit
          inputs:
            sitemap_plan: $input.sitemap_plan
          context:
            digest_result: digest.digest_result.data
          run:
            type: javascript
            module: google-search-console.mjs
            export: admitSitemapSubmission
            outputs:
              submission_admission: object
        - id: submit
          when:
            field: admit.submission_admission.decision
            equals: ready
          tool: provider.mutate
          mutation: true
          idempotency_key: $input.idempotency_key
          scopes: [sitemaps.submit]
          policy:
            provider_permission: { verb: write }
          inputs:
            operation: sitemaps.submit
            target: $input.sitemap_plan.sitemap_url
            expected_provider: google-search-console
            idempotency_key: $input.idempotency_key
            expected_result:
              property: $input.sitemap_plan.property
              sitemap_url: $input.sitemap_plan.sitemap_url
            result_fields: [property, sitemap_url, accepted_at, idempotency_key]
            input:
              property: $input.sitemap_plan.property
              sitemap_url: $input.sitemap_plan.sitemap_url
        - id: readback
          tool: provider.read
          scopes: [sitemaps.read]
          policy:
            provider_permission: { verb: read }
          inputs:
            operation: sitemaps.get
            target: $input.sitemap_plan.sitemap_url
            expected_provider: google-search-console
            result_fields: [property, sitemap_url, status, last_submitted, last_downloaded, error_count, warning_count]
            input:
              property: $input.sitemap_plan.property
              sitemap_url: $input.sitemap_plan.sitemap_url
          context:
            expected_result: submit.provider_operation.data.result
        - id: finalize
          when:
            field: admit.submission_admission.decision
            equals: ready
          inputs:
            idempotency_key: $input.idempotency_key
            sitemap_plan: $input.sitemap_plan
          context:
            mutation_result: submit.provider_operation.data.result
            readback_result: readback.provider_operation.data.result
          run:
            type: javascript
            module: google-search-console.mjs
            export: finalizeSitemapSubmission
            outputs:
              sitemap_submission: object
          artifacts:
            named_emits: { sitemap_submission: sitemap_submission }
  plan-indexing:
    type: graph
    inputs:
      url:
        type: string
        required: true
        description: Exact URL proposed for Google's restricted Indexing API.
      resource_type:
        type: string
        required: true
        description: Domain resource type, for example article, job_posting, or broadcast_event.
      reason:
        type: string
        required: false
        description: Operator rationale for the request.
    graph:
      name: google-search-console-plan-indexing
      steps:
        - id: classify
          inputs:
            url: $input.url
            resource_type: $input.resource_type
            reason: $input.reason
          run:
            type: javascript
            module: google-search-console.mjs
            export: classifyIndexingRequest
            outputs:
              indexing_admission: object
          artifacts:
            named_emits: { indexing_admission: indexing_admission }
