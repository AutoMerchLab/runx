skill: governed-outbound
version: "0.3.1"
catalog:
  kind: graph
  audience: public
  visibility: public
  role: context
  execution: execute
  completion: provider_readback
  requires_adapter: true
  approval: required
harness:
  cases:
    - name: governed-outbound-approved-plan
      operator_journeys:
        - mode: standalone
          request: Fetch this allowlisted source, remove personal data, and prepare the exact approved outbound handoff.
          expected_outcome: Return a digest-bound scrubbed payload and truthful provider-neutral delivery handoff without leaking source PII.
        - mode: composed
          request: Continue outbound delivery from this already bounded source and target plan.
          expected_outcome: Reuse supplied source evidence and target intent without refetching, rescrubbing, or claiming delivery.
          prior_evidence:
            - The allowlisted source, target intent, and approval context supplied in the fixture.
          must_not_repeat:
            - Do not fetch the external source again.
            - Do not repeat redaction after deterministic residual scanning has passed.
      runner: plan
      env:
        RUNX_PROVIDER_PERMISSION_GRANT_ID: provider-read-demo
        RUNX_PROVIDER_PERMISSION_GRANTED_SCOPES: '["runx:net:allowlist"]'
      inputs:
        url: https://fixture.runx.invalid/source
        allowlist:
          - fixture.runx.invalid
        channel: "#incidents"
        principal: account:ops-bot
        operator_context: Public incident-summary planning; provider delivery remains separate.
      caller:
        web_responses:
          "https://fixture.runx.invalid/source":
            status: 200
            headers: { content-type: text/plain }
            body: hello world
        answers:
          agent_task.redact-pii-detect.output:
            redaction_draft:
              decision: ready
              detected: []
              residual_risk:
                level: low
                reason_code: none
          agent_task.send-as.output:
            send_plan:
              decision: ready
              action_family: send-as
              principal:
                type: account
                ref: account:ops-bot
              provider:
                name: slack
                account_ref: workspace:incidents
                runtime_path: channel.post
              send_class: status
              channel: chat
              audience:
                type: channel
                ref: "#incidents"
                requires_reconfirmation: false
              content:
                draft_ref: governed-outbound:redacted-content
                digest: sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
                subject_or_title: Example Domain update
              gates:
                preflight_required: true
                human_approval_required: true
                approval_ref: governed-outbound.send.approval
              blockers: []
              provider_actions:
                - channel.post
              evidence_refs:
                - sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
              success_checkpoint:
                milestone: provider_delivery_required
                description: Provider delivery and readback remain required after this plan.
        approvals:
          governed-outbound.send.approval: true
      expect:
        status: sealed
        steps:
          - fetch-source
          - scrub-content
          - approve-send
          - plan-notice
          - finalize
        step_outputs:
          finalize:
            subset:
              outbound_plan:
                decision: ready
                completion: plan_only
                provider_delivery: not_executed
                principal: account:ops-bot
                audience: "#incidents"
                redaction:
                  digest: sha256:b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
                provider_actions:
                  - channel.post
        receipt:
          schema: runx.receipt.v1
    - name: governed-outbound-redaction-hold
      runner: plan
      env:
        RUNX_PROVIDER_PERMISSION_GRANT_ID: provider-read-hold-demo
        RUNX_PROVIDER_PERMISSION_GRANTED_SCOPES: '["runx:net:allowlist"]'
      inputs:
        url: https://fixture.runx.invalid/source
        allowlist:
          - fixture.runx.invalid
        channel: "#incidents"
        principal: account:ops-bot
      caller:
        web_responses:
          "https://fixture.runx.invalid/source":
            status: 200
            headers: { content-type: text/plain }
            body: hello world
        answers:
          agent_task.redact-pii-detect.output:
            redaction_draft:
              decision: needs_review
              detected: []
              residual_risk:
                level: medium
                reason_code: ambiguous_semantics
      expect:
        status: policy_denied
        step_outputs:
          scrub-content:
            subset:
              redaction_report:
                data:
                  decision: needs_review
                  redacted_digest: null
    - name: governed-outbound-needs-target
      runner: plan
      inputs: {}
      expect:
        status: failure
runners:
  deliver:
    default: true
    type: graph
    inputs:
      url:
        type: string
        required: true
        description: Allowlisted source URL to fetch before outbound delivery.
      allowlist:
        type: json
        required: true
      channel:
        type: string
        required: true
        description: Exact provider-neutral audience or destination.
      principal:
        type: string
        required: true
        description: Principal the scrubbed content is sent as.
      operator_context:
        type: string
        required: false
      delivery:
        type: object
        required: true
        description: Provider operation descriptor whose payload contains exactly one `{{runx.redacted_content}}` placeholder.
        schema:
          required: [provider, target, operation, readback_operation, payload, result_fields]
          additionalProperties: false
          properties:
            provider: { type: string, minLength: 1, maxLength: 100 }
            target: { type: string, minLength: 1, maxLength: 2048 }
            operation: { type: string, minLength: 1, maxLength: 100 }
            readback_operation: { type: string, minLength: 1, maxLength: 100 }
            payload: { type: object, additionalProperties: true }
            expected_result: { type: object, additionalProperties: true }
            result_fields:
              type: array
              minItems: 1
              maxItems: 32
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 100 }
      idempotency_key:
        type: string
        required: true
        description: Stable retry key for this exact outbound delivery.
    graph:
      name: governed-outbound-deliver
      result_from: [send]
      steps:
        - id: fetch-source
          skill: ../web-fetch
          runner: web-fetch
          scopes: [runx:net:allowlist]
          inputs:
            url: $input.url
            allowlist: $input.allowlist
            extract: text
        - id: scrub-content
          skill: ../redact-pii
          runner: redact-pii
          scopes: [runx:content:read]
          inputs:
            mode: redact
          context:
            content: fetch-source.fetch_result.data.extracted
        - id: bind-delivery
          inputs:
            delivery: $input.delivery
          context:
            redaction: scrub-content.redaction_report.data
          run:
            type: javascript
            module: governed-outbound.mjs
            export: bindDelivery
            outputs:
              delivery: object
        - id: send
          when:
            field: scrub-content.redaction_report.data.decision
            equals: ready
          skill: ../send-as
          runner: send
          mutation: true
          inputs:
            objective: Deliver the exact scrubbed outbound content and verify provider readback.
            principal: $input.principal
            audience: $input.channel
            operator_context: $input.operator_context
            idempotency_key: $input.idempotency_key
          context:
            content_ref: scrub-content.redaction_report.data
            delivery: bind-delivery.delivery

  plan:
    type: graph
    inputs:
      url:
        type: string
        required: true
        description: Source URL to gather before preparing the notification.
      allowlist:
        type: json
        required: true
        description: Hosts the fetch is permitted to reach.
      channel:
        type: string
        required: true
        description: Destination channel for the notification plan.
      principal:
        type: string
        required: true
        description: Principal the notification would be sent as.
      operator_context:
        type: string
        required: false
        description: Boundary, audience, or compliance context for the plan.
    graph:
      name: governed-outbound
      result_from: [finalize]
      steps:
        - id: fetch-source
          label: gather the source
          skill: ../web-fetch
          runner: web-fetch
          scopes:
            - runx:net:allowlist
          inputs:
            url: $input.url
            allowlist: $input.allowlist
            extract: text
        - id: scrub-content
          label: scrub personal data before the boundary
          skill: ../redact-pii
          runner: redact-pii
          scopes:
            - runx:content:read
          inputs:
            mode: redact
          context:
            content: fetch-source.fetch_result.data.extracted
        - id: approve-send
          label: approve the exact downstream plan
          run:
            type: approval
          inputs:
            gate_id: governed-outbound.send.approval
            reason: Approve the exact scrubbed-content plan; provider execution and delivery readback remain separate.
          context:
            decision: scrub-content.redaction_report.data.decision
            residual_risk: scrub-content.redaction_report.data.residual_risk
            redacted_digest: scrub-content.redaction_report.data.redacted_digest
          artifacts:
            wrap_as: approval_decision
            packet: runx.approval.decision.v1
        - id: plan-notice
          label: authorize the governed notification plan
          skill: ../send-as
          runner: plan
          inputs:
            objective: Authorize the approved scrubbed update for a separate provider adapter.
            principal: $input.principal
            audience: $input.channel
            provider_context: $input.operator_context
          context:
            content_ref: scrub-content.redaction_report.data
        - id: finalize
          label: validate and seal the plan-only handoff
          inputs:
            principal: $input.principal
            channel: $input.channel
          context:
            source: fetch-source.fetch_result.data
            redaction: scrub-content.redaction_report.data
            approval: approve-send.approval_decision.data
            send_plan: plan-notice.send_plan.data
          run:
            type: javascript
            module: governed-outbound.mjs
            outputs:
              outbound_plan:
                type: object
                schema:
                  required: [decision, completion, provider_delivery, principal, audience, source, redaction, approval, provider_actions, send_plan]
                  additionalProperties: false
                  properties:
                    decision: { const: ready }
                    completion: { const: plan_only }
                    provider_delivery: { const: not_executed }
                    principal: { type: string, minLength: 1 }
                    audience: { type: string, minLength: 1 }
                    source:
                      type: object
                      required: [final_url, digest, fetched_at]
                      additionalProperties: false
                      properties:
                        final_url: { type: string, format: uri }
                        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                        fetched_at: { type: string }
                    redaction:
                      type: object
                      required: [digest, source_digest]
                      additionalProperties: false
                      properties:
                        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                        source_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                    approval:
                      type: object
                      required: [approved, gate_id]
                      additionalProperties: false
                      properties:
                        approved: { const: true }
                        gate_id: { type: string, minLength: 1 }
                    provider_actions: { type: array, items: { type: string }, uniqueItems: true }
                    send_plan:
                      type: object
                      required: [decision, principal, audience, content, success_checkpoint]
                      properties:
                        decision: { const: ready }
                        principal:
                          type: object
                          required: [ref]
                          properties: { ref: { type: string, minLength: 1 } }
                        audience:
                          type: object
                          required: [ref]
                          properties: { ref: { type: string, minLength: 1 } }
                        content:
                          type: object
                          required: [digest]
                          properties: { digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' } }
                        success_checkpoint:
                          type: object
                          required: [milestone]
                          properties: { milestone: { const: provider_delivery_required } }
                      additionalProperties: true
          artifacts:
            wrap_as: outbound_plan_packet
            packet: runx.governed_outbound.plan.v1
      policy:
        guards:
          - step: approve-send
            field: scrub-content.redaction_report.data.decision
            equals: ready
          - step: plan-notice
            field: approve-send.approval_decision.data.approved
            equals: true
          - step: plan-notice
            field: scrub-content.redaction_report.data.decision
            equals: ready
          - step: finalize
            field: approve-send.approval_decision.data.approved
            equals: true
          - step: finalize
            field: scrub-content.redaction_report.data.decision
            equals: ready
