skill: mcp-echo
version: "0.1.0"
runners:
  default:
    default: true
    type: mcp
    server:
      command: node
      args:
        - fixtures/runtime/adapters/mcp/stdio-server.mjs
      cwd: ../../..
    tool: echo
    arguments:
      message: "{{message}}"
    timeout_seconds: 15
    sandbox:
      profile: readonly
      cwd_policy: workspace
    inputs:
      message:
        type: string
        required: true
        description: Message to echo through MCP.
